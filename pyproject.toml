   [build-system]
   requires = ["setuptools>=61"]
   build-backend = "setuptools.build_meta"

   [project]
   name = "shorturl"
   version = "0.1.0"
   requires-python = ">=3.10"
   dependencies = ["Flask==3.1.3"]

   [project.scripts]
   shorturl = "app:main"

   [tool.setuptools]
   py-modules = ["app"]
